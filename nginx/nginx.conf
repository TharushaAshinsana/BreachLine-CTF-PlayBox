# S1: leaked internal subdomain -> CTFd internal landing page
server {
    listen 80;
    server_name intra.novatech.local;

    location / {
        proxy_pass http://ctfd:8000/internal-landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# S3: portal subdomain -> vulnerable portal container
server {
    listen 80;
    server_name portal.novatech.local;

    location / {
        proxy_pass http://s3-web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default: everything else -> CTFd
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://ctfd:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}