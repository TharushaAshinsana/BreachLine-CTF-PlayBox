# Allow larger uploads (S5 forensic image, etc.)
# Increase if you later attach bigger files.
client_max_body_size 200m;

# S1: leaked internal subdomain -> CTFd internal landing page
server {
    listen 80;
    server_name intra.novatech.local;

    # allow uploads too (not required here, but harmless)
    client_max_body_size 200m;

    location / {
        proxy_pass http://ctfd:8000/internal-landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # timeouts (safe defaults)
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}

# S3: portal subdomain -> vulnerable portal container
server {
    listen 80;
    server_name portal.novatech.local;

    client_max_body_size 200m;

    location / {
        proxy_pass http://s3-web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}

# Default: everything else -> CTFd
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200m;

    # Prevent shortcut to S1 internal landing on default host
    location = /internal-landing {
        return 404;
    }

    location / {
        proxy_pass http://ctfd:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}