services:
  ctfd:
    image: ctfd/ctfd:latest
    container_name: breachline-ctfd
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://ctfd:ctfdpass@db:3306/ctfd
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - ctf-network
    volumes:
      - ctfd-data:/var/uploads

  db:
    image: mariadb:10.11
    container_name: breachline-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ctfd
      MYSQL_USER: ctfd
      MYSQL_PASSWORD: ctfdpass
    networks:
      - ctf-network
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: breachline-redis
    restart: unless-stopped
    networks:
      - ctf-network

  nginx:
    image: nginx:alpine
    container_name: breachline-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ctf-network
    depends_on:
      - ctfd
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  ctf-network:
    driver: bridge

volumes:
  ctfd-data:
  db-data:
