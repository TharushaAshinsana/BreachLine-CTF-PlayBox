services:
  ctfd:
    image: ctfd/ctfd:latest
    container_name: breachline-ctfd
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://ctfd:ctfdpass@db:3306/ctfd
      REDIS_URL: redis://redis:6379
      REVERSE_PROXY: "true"
    depends_on:
      - db
      - redis
    networks:
      - ctf-network
    volumes:
      - ctfd-data:/var/uploads

  db:
    image: mariadb:10.11
    container_name: breachline-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ctfd
      MYSQL_USER: ctfd
      MYSQL_PASSWORD: ctfdpass
    networks:
      - ctf-network
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: breachline-redis
    restart: unless-stopped
    networks:
      - ctf-network

  # S3 DB (challenge network only)
  s3-db:
    image: mariadb:10.11
    container_name: breachline-s3-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portalpass
    networks:
      - challenge-network
    volumes:
      - s3-db-data:/var/lib/mysql
      - ./challenges/member2/s3-point-of-entry/db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

  # S3 Web (challenge network only)
  s3-web:
    build: ./challenges/member2/s3-point-of-entry
    container_name: breachline-s3-web
    restart: unless-stopped
    environment:
      DB_HOST: s3-db
      DB_USER: portal
      DB_PASS: portalpass
      DB_NAME: portal
      APP_SECRET: change_me
    depends_on:
      - s3-db
    networks:
      - challenge-network

  nginx:
    image: nginx:alpine
    container_name: breachline-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ctf-network
      - challenge-network
    depends_on:
      - ctfd
      - s3-web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  ctf-network:
    driver: bridge

  challenge-network:
    driver: bridge
    internal: true

volumes:
  ctfd-data:
  db-data:
  s3-db-data: